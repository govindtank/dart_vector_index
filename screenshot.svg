<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 440" width="850" height="440" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="850" height="440" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <g transform="translate(30, 25)">
    <circle cx="10" cy="12" r="5" fill="#EF4444"/>
    <circle cx="28" cy="12" r="5" fill="#F59E0B"/>
    <circle cx="46" cy="12" r="5" fill="#10B981"/>
    <text x="70" y="17" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">dart_vector_index</text>
    <rect x="230" y="2" width="100" height="22" rx="11" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
    <text x="280" y="16" fill="#22D3EE" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">PURE DART</text>
    <rect x="340" y="2" width="120" height="22" rx="11" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
    <text x="400" y="16" fill="#C084FC" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">HNSW + FLAT INDEX</text>
    <rect x="470" y="2" width="110" height="22" rx="11" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
    <text x="525" y="16" fill="#34D399" font-family="sans-serif" font-size="11" font-weight="600" text-anchor="middle">SQ8 4x SAVINGS</text>
  </g>

  <!-- Left: HNSW Graph Visualizer -->
  <g transform="translate(30, 70)">
    <rect width="440" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="20" y="28" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="600">HNSW MULTI-LAYER GRAPH ROUTING</text>

    <!-- Layer 2 (Top sparse layer) -->
    <g transform="translate(20, 50)">
      <rect width="400" height="60" rx="8" fill="#1E293B" stroke="#475569" stroke-dasharray="4 4"/>
      <text x="12" y="18" fill="#64748B" font-family="monospace" font-size="10">Layer 2 (Entry Point, sparse)</text>
      <!-- Connections -->
      <line x1="80" y1="36" x2="220" y2="36" stroke="#3B82F6" stroke-width="2"/>
      <line x1="220" y1="36" x2="340" y2="36" stroke="#3B82F6" stroke-width="2"/>
      <!-- Nodes -->
      <circle cx="80" cy="36" r="8" fill="#3B82F6" filter="url(#glow)"/>
      <circle cx="220" cy="36" r="10" fill="#06B6D4" filter="url(#glow)"/>
      <text x="220" y="40" fill="#0F172A" font-family="sans-serif" font-size="9" font-weight="800" text-anchor="middle">EP</text>
      <circle cx="340" cy="36" r="8" fill="#3B82F6"/>
    </g>

    <!-- Vertical Drop Line from EP to Layer 1 -->
    <path d="M 240 86 L 240 145" stroke="#06B6D4" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Layer 1 (Mid layer) -->
    <g transform="translate(20, 130)">
      <rect width="400" height="70" rx="8" fill="#1E293B" stroke="#475569" stroke-dasharray="4 4"/>
      <text x="12" y="18" fill="#64748B" font-family="monospace" font-size="10">Layer 1 (Greedy routing)</text>
      <line x1="60" y1="42" x2="130" y2="42" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="130" y1="42" x2="220" y2="42" stroke="#06B6D4" stroke-width="2"/>
      <line x1="220" y1="42" x2="290" y2="42" stroke="#8B5CF6" stroke-width="1.5"/>
      <line x1="290" y1="42" x2="360" y2="42" stroke="#8B5CF6" stroke-width="1.5"/>
      <circle cx="60" cy="42" r="7" fill="#8B5CF6"/>
      <circle cx="130" cy="42" r="7" fill="#8B5CF6"/>
      <circle cx="220" cy="42" r="9" fill="#06B6D4" filter="url(#glow)"/>
      <circle cx="290" cy="42" r="7" fill="#8B5CF6"/>
      <circle cx="360" cy="42" r="7" fill="#8B5CF6"/>
    </g>

    <!-- Vertical Drop Line from Mid to Layer 0 -->
    <path d="M 240 172 L 240 235" stroke="#10B981" stroke-width="2" stroke-dasharray="3 3"/>

    <!-- Layer 0 (Dense Ground Layer) -->
    <g transform="translate(20, 220)">
      <rect width="400" height="95" rx="8" fill="#1E293B" stroke="#10B981" stroke-width="1.2"/>
      <text x="12" y="18" fill="#34D399" font-family="monospace" font-size="10" font-weight="700">Layer 0 (Ground Layer — efSearch Beam Search)</text>
      <!-- Grid links -->
      <line x1="45" y1="45" x2="105" y2="45" stroke="#475569" stroke-width="1"/>
      <line x1="105" y1="45" x2="175" y2="55" stroke="#10B981" stroke-width="2"/>
      <line x1="175" y1="55" x2="235" y2="45" stroke="#10B981" stroke-width="2"/>
      <line x1="235" y1="45" x2="295" y2="65" stroke="#10B981" stroke-width="2"/>
      <line x1="295" y1="65" x2="365" y2="45" stroke="#475569" stroke-width="1"/>
      <!-- Target Match Highlight -->
      <circle cx="235" cy="45" r="12" fill="#10B981" filter="url(#glow)"/>
      <text x="235" y="49" fill="#0F172A" font-family="sans-serif" font-size="9" font-weight="900" text-anchor="middle">TOP 1</text>
      <!-- Surrounding nodes -->
      <circle cx="45" cy="45" r="6" fill="#64748B"/>
      <circle cx="105" cy="45" r="7" fill="#10B981"/>
      <circle cx="175" cy="55" r="8" fill="#10B981"/>
      <circle cx="295" cy="65" r="8" fill="#10B981"/>
      <circle cx="365" cy="45" r="6" fill="#64748B"/>
    </g>
  </g>

  <!-- Right: Architecture, Metrics & Features -->
  <g transform="translate(490, 70)">
    <rect width="330" height="340" rx="12" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>

    <text x="20" y="28" fill="#94A3B8" font-family="sans-serif" font-size="13" font-weight="600">ENGINE CAPABILITIES</text>

    <!-- Metrics Badge Grid -->
    <g transform="translate(20, 45)">
      <rect width="90" height="26" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="1"/>
      <text x="45" y="17" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Cosine</text>

      <rect x="98" width="90" height="26" rx="6" fill="#10B981" fill-opacity="0.15" stroke="#10B981" stroke-width="1"/>
      <text x="143" y="17" fill="#34D399" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">Euclidean</text>

      <rect x="196" width="90" height="26" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B" stroke-width="1"/>
      <text x="241" y="17" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="700" text-anchor="middle">DotProduct</text>
    </g>

    <!-- Feature Row 1: Zero Dependencies -->
    <g transform="translate(20, 88)">
      <circle cx="10" cy="10" r="10" fill="#10B981" fill-opacity="0.2"/>
      <text x="10" y="14" fill="#10B981" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
      <text x="30" y="14" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">100% Pure Dart — No C++ / SQLite</text>
      <text x="30" y="28" fill="#64748B" font-family="sans-serif" font-size="10">Runs on Mobile, Web, Desktop &amp; Cloud</text>
    </g>

    <!-- Feature Row 2: Metadata Filtering -->
    <g transform="translate(20, 135)">
      <circle cx="10" cy="10" r="10" fill="#06B6D4" fill-opacity="0.2"/>
      <text x="10" y="14" fill="#06B6D4" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
      <text x="30" y="14" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Rich Predicate Metadata Filtering</text>
      <text x="30" y="28" fill="#64748B" font-family="sans-serif" font-size="10">Filter.and([Filter.eq(), Filter.gte()])</text>
    </g>

    <!-- Feature Row 3: SQ8 Compression -->
    <g transform="translate(20, 182)">
      <circle cx="10" cy="10" r="10" fill="#8B5CF6" fill-opacity="0.2"/>
      <text x="10" y="14" fill="#8B5CF6" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
      <text x="30" y="14" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">8-Bit Scalar Quantization (SQ8)</text>
      <text x="30" y="28" fill="#64748B" font-family="sans-serif" font-size="10">4x RAM compression for mobile LLMs</text>
    </g>

    <!-- Feature Row 4: File Persistence -->
    <g transform="translate(20, 229)">
      <circle cx="10" cy="10" r="10" fill="#EC4899" fill-opacity="0.2"/>
      <text x="10" y="14" fill="#EC4899" font-size="12" font-weight="bold" text-anchor="middle">✓</text>
      <text x="30" y="14" fill="#F1F5F9" font-family="sans-serif" font-size="12" font-weight="600">Atomic File &amp; JSON Storage</text>
      <text x="30" y="28" fill="#64748B" font-family="sans-serif" font-size="10">Instant disk backup &amp; background restore</text>
    </g>

    <!-- Performance Stats Card -->
    <g transform="translate(20, 275)">
      <rect width="290" height="50" rx="8" fill="#0B0F19" stroke="#334155" stroke-width="1"/>
      <text x="15" y="20" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600">HNSW QUERY LATENCY</text>
      <text x="15" y="38" fill="#10B981" font-family="monospace" font-size="16" font-weight="800">&lt; 0.2ms</text>
      <text x="160" y="20" fill="#94A3B8" font-family="sans-serif" font-size="10" font-weight="600">SEARCH RECALL</text>
      <text x="160" y="38" fill="#22D3EE" font-family="monospace" font-size="16" font-weight="800">&gt; 99.2%</text>
    </g>
  </g>
</svg>
